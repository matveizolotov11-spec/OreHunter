name: Build ShadowHitbox
on:
  push:
    paths:
      - 'ShadowHitbox/**'
      - '.github/workflows/shadowhitbox-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ShadowHitbox
        working-directory: ShadowHitbox
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowHitbox-1.21.11
          path: ShadowHitbox/build/libs/ShadowHitbox-*.jar
          if-no-files-found: error
