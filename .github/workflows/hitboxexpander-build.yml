name: Build HitboxExpander
on:
  push:
    paths:
      - 'HitboxExpander/**'
      - '.github/workflows/hitboxexpander-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build HitboxExpander
        working-directory: HitboxExpander
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HitboxExpander-1.21.11
          path: HitboxExpander/build/libs/HitboxExpander-*.jar
          if-no-files-found: error
