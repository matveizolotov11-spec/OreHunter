name: Build BowRapidFire
on:
  push:
    branches: [ "main" ]
    paths:
      - "BowRapidFire/**"
      - ".github/workflows/bowrapidfire.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BowRapidFire
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build BowRapidFire
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BowRapidFire-1.21.11
          path: BowRapidFire/build/libs/BowRapidFire-1.0.0.jar
          if-no-files-found: error
